[build-system]
requires = ["setuptools>=61.0", "setuptools-rust>=1.8.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aibom-inspector"
version = "0.2.0"
description = "Security and risk analysis tool for AI projects (AI-BOM)."
license = "Apache-2.0"
authors = [
    { name = "Jordan Desjarlais", email = "jordandesjarlais.2022@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "packaging>=23.0",
    "PyYAML>=6.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]
keywords = ["ai", "security", "supply-chain", "bom", "risk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/MellyFinnese/AI-BOM-Inspector"
Repository = "https://github.com/MellyFinnese/AI-BOM-Inspector"
"Bug Tracker" = "https://github.com/MellyFinnese/AI-BOM-Inspector/issues"

[project.optional-dependencies]
huggingface = ["huggingface_hub>=0.26.0"]
dev = [
    "build>=1.2.1",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-requests>=2.32.0.20240622",
]
fuzz = ["atheris>=2.3.0"]
enterprise = [
    "cryptography>=42.0.0",
    "PyJWT[crypto]>=2.8.0",
    "python3-saml>=1.16.0",
    "fastapi>=0.115.0",
]

[project.scripts]
aibom = "aibom_inspector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aibom_inspector = ["data/*.json"]

[tool.setuptools-rust]
rust_extensions = [
    { name = "aibom_inspector._tensor_fuzz", path = "crates/core/Cargo.toml", binding = "pyo3" }
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
mypy_path = "src"
