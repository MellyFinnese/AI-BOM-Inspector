name: CI — Tests & Golden Demo

on:
  push:
    branches: [ main, 'feature/*', 'mellyfinnese-*' ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: Run test suite (including golden demo assertion)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run pytest
        run: |
          pytest -q --maxfail=1

      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: ./.pytest_cache || .
