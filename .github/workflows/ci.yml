name: CI

on:
  push:
    branches: [ "main", "work" ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
      - name: Check dependency consistency
        run: |
          python - <<'PY'
          import tomllib, sys, re
          py = tomllib.loads(open('pyproject.toml','rb').read())
          deps = {re.split(r'[<=>]', d.strip())[0].lower() for d in py.get('project', {}).get('dependencies', [])}
          reqs_lines = [l.strip() for l in open('requirements.txt').read().splitlines() if l.strip()]
          reqs = {re.split(r'[<=>]', r)[0].lower() for r in reqs_lines}
          missing = deps - reqs
          extra = reqs - deps
          if missing or extra:
              print('Dependency mismatch detected')
              if missing: print('in pyproject not in requirements:', missing)
              if extra: print('in requirements not in pyproject:', extra)
              sys.exit(1)
          print('Dependencies consistent')
          PY
      - name: Run ruff format
        run: ruff format --check .
      - name: Run ruff
        run: ruff check .
      - name: Run mypy
        run: mypy .
      - name: Check for bidirectional control characters
        run: python -m aibom_inspector.bidi_guard

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
      - name: Run tests
        run: pytest

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/core
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cargo fmt
        run: cargo fmt -- --check
      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Cargo test
        run: cargo test --all-targets
