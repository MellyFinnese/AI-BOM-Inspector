name: Exporters Validate

on:
  pull_request:
    paths:
      - 'src/aibom_inspector/exporters/**'
      - 'tests/**'
      - 'schemas/**'
  push:
    branches: [ 'mellyfinnese-enterprise-ai-bom', 'main' ]

jobs:
  test:
    name: Run exporter unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest jsonschema

      - name: Check for legacy pickles (fail PR if present)
        id: pickles_check
        continue-on-error: true
        run: |
          python3 scripts/check_for_pickles.py

      - name: Post remediation comment and create check annotations if legacy pickles detected
        if: steps.pickles_check.conclusion == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = 'scripts/pickles_violations.json';
            let body = '';
            let annotations = [];
            if (fs.existsSync(path)) {
              const data = JSON.parse(fs.readFileSync(path, 'utf8'));
              const violations = data.violations || [];
              body += '⚠️ **Policy enforcement:** legacy Pickle artifacts were detected in this PR.\n\n';
              body += '**Files:**\n';
              for (const v of violations) { body += `- ${v}\n`; }
              body += '\n**Why this is blocked:** Pickle formats (.pkl, .pt) are unsafe and can execute arbitrary code during deserialization. For security and supply-chain hygiene, these formats are disallowed by policy.\n\n';
              body += '**Remediation (recommended):**\n';
              body += '- Convert weights to a secure, static format such as Safetensors or GGUF. Example (PyTorch -> Safetensors using safetensors):\n';
              body += '  ```bash\n';
              body += '  # example using safetensors (install safetensors first)\n';
              body += "  python -c \"import torch; from safetensors.torch import save_file; w=torch.load('model.pt', map_location='cpu'); save_file(w, 'model.safetensors')\"\n";
              body += '  ```\n\n';
              body += '- If the artifact must be included, open a policy exception request and provide provenance/attestation (why, who approved, and fallback plan).\n\n';
              body += '**Next steps for maintainers:**\n';
              body += '- Remove legacy artifacts from the PR or replace them with a converted safetensors/gguf artifact.\n';
              body += '- If conversion is not possible, add justification and request an exception following the repository policy.\n\n';
              body += 'If you want, request a security review and include the model provenance and a signed attestation (Sigstore/in-toto).';

              // Create annotations for the Checks API (limited to 50 annotations)
              for (const v of violations.slice(0, 50)) {
                annotations.push({
                  path: v,
                  start_line: 1,
                  end_line: 1,
                  annotation_level: 'failure',
                  message: `Legacy Pickle artifact detected: ${v}. Convert to Safetensors/GGUF or request exception.`,
                  title: 'Legacy Pickle format detected',
                });
              }

            } else {
              body = 'Policy check failed but no violation file was produced; please inspect the CI logs.';
            }

            // Post PR comment
            await github.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

            // Create a Check Run with annotations so they appear inline in the Files/Checks view
            const maxAnnotations = 50;
            const head_sha = context.sha;
            await github.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'AI-BOM-Inspector: Pickle Policy',
              head_sha: head_sha,
              status: 'completed',
              conclusion: 'failure',
              output: {
                title: 'Legacy Pickle artifacts detected',
                summary: 'One or more legacy Pickle artifacts (.pkl, .pt) were found in this PR and are blocked by policy.',
                annotations: annotations.slice(0, maxAnnotations),
              },
            });

      - name: Run pytest
        run: |
          pytest -q

  sandbox-inspect:
    name: Sandbox dynamic inspection (self-hosted)
    runs-on: [self-hosted, linux, sandbox]
    needs: test
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Re-run pickles check to discover artifacts
        run: |
          python3 scripts/check_for_pickles.py || true

      - name: Run sandbox tracer for each violation (self-hosted only)
        if: always()
        run: |
          set -e
          if [ -f scripts/pickles_violations.json ]; then
            mkdir -p sandbox_traces
            jq -r '.violations[]' scripts/pickles_violations.json | while read -r f; do
              echo "Running sandbox for $f"
              python3 scripts/pickle_sandbox_runner.py "$f" --no-build --output "sandbox_traces/$(basename $f).trace.json" --seccomp ".github/security/seccomp/aibom-sandbox.json" --apparmor "aibom-sandbox" || true
            done
          else
            echo "No violations file found; skipping sandbox run"
          fi

      - name: Upload sandbox traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-traces
          path: sandbox_traces/**
