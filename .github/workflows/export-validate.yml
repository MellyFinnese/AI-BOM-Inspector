name: Exporters Validate

on:
  pull_request:
    paths:
      - 'src/aibom_inspector/exporters/**'
      - 'tests/**'
      - 'schemas/**'
  push:
    branches: [ 'mellyfinnese-enterprise-ai-bom', 'main' ]

jobs:
  test:
    name: Run exporter unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest jsonschema

      - name: Run pytest
        run: |
          pytest -q
