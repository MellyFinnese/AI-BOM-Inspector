asyncapi: 2.6.0
info:
  title: AI-BOM Inspector Control Plane Events
  version: 1.0.0
  description: |
    Aspirational event contract for Control Plane integrations. Intended for
    webhook, message bus, or streaming implementations.
servers:
  production:
    url: https://events.example.com
    protocol: https
channels:
  evidence.ingested:
    description: Evidence bundle successfully ingested.
    publish:
      message:
        $ref: '#/components/messages/EvidenceIngested'
  policy.decision.recorded:
    description: Policy decision recorded for an asset.
    publish:
      message:
        $ref: '#/components/messages/PolicyDecisionRecorded'
  audit.event.created:
    description: Audit event created in the Control Plane.
    publish:
      message:
        $ref: '#/components/messages/AuditEventCreated'
  sso.provider.configured:
    description: SSO provider configured or updated.
    publish:
      message:
        $ref: '#/components/messages/SsoProviderConfigured'
  sso.provider.deleted:
    description: SSO provider deleted.
    publish:
      message:
        $ref: '#/components/messages/SsoProviderDeleted'
  rbac.role.assigned:
    description: Role assigned to a principal.
    publish:
      message:
        $ref: '#/components/messages/RoleAssigned'
  rbac.role.revoked:
    description: Role assignment revoked for a principal.
    publish:
      message:
        $ref: '#/components/messages/RoleRevoked'
  rbac.role.updated:
    description: Role updated or deleted.
    publish:
      message:
        $ref: '#/components/messages/RoleUpdated'
  policy.pack.published:
    description: Policy pack published or updated.
    publish:
      message:
        $ref: '#/components/messages/PolicyPackPublished'
  policy.pack.deleted:
    description: Policy pack deleted.
    publish:
      message:
        $ref: '#/components/messages/PolicyPackDeleted'
  compliance.report.generated:
    description: Compliance report generated or updated.
    publish:
      message:
        $ref: '#/components/messages/ComplianceReportGenerated'
  compliance.report.signed:
    description: Compliance report signed and integrity sealed.
    publish:
      message:
        $ref: '#/components/messages/ComplianceReportSigned'
components:
  messages:
    EvidenceIngested:
      name: EvidenceIngested
      payload:
        $ref: '#/components/schemas/EvidenceEvent'
    PolicyDecisionRecorded:
      name: PolicyDecisionRecorded
      payload:
        $ref: '#/components/schemas/PolicyDecisionEvent'
    AuditEventCreated:
      name: AuditEventCreated
      payload:
        $ref: '#/components/schemas/AuditEvent'
    SsoProviderConfigured:
      name: SsoProviderConfigured
      payload:
        $ref: '#/components/schemas/SsoProviderEvent'
    SsoProviderDeleted:
      name: SsoProviderDeleted
      payload:
        $ref: '#/components/schemas/SsoProviderEvent'
    RoleAssigned:
      name: RoleAssigned
      payload:
        $ref: '#/components/schemas/RoleAssignmentEvent'
    RoleRevoked:
      name: RoleRevoked
      payload:
        $ref: '#/components/schemas/RoleAssignmentEvent'
    RoleUpdated:
      name: RoleUpdated
      payload:
        $ref: '#/components/schemas/RoleEvent'
    PolicyPackPublished:
      name: PolicyPackPublished
      payload:
        $ref: '#/components/schemas/PolicyPackEvent'
    PolicyPackDeleted:
      name: PolicyPackDeleted
      payload:
        $ref: '#/components/schemas/PolicyPackEvent'
    ComplianceReportGenerated:
      name: ComplianceReportGenerated
      payload:
        $ref: '#/components/schemas/ComplianceReportEvent'
    ComplianceReportSigned:
      name: ComplianceReportSigned
      payload:
        $ref: '#/components/schemas/ComplianceReportEvent'
  schemas:
    EvidenceEvent:
      type: object
      required: [event_id, org_id, asset_fingerprint, bundle_hash, created_at]
      properties:
        event_id:
          type: string
        org_id:
          type: string
        asset_fingerprint:
          type: string
        bundle_hash:
          type: string
        created_at:
          type: string
          format: date-time
    PolicyDecisionEvent:
      type: object
      required: [event_id, org_id, asset_fingerprint, status, created_at]
      properties:
        event_id:
          type: string
        org_id:
          type: string
        asset_fingerprint:
          type: string
        status:
          type: string
          enum: [pass, fail]
        created_at:
          type: string
          format: date-time
    AuditEvent:
      type: object
      required: [event_id, org_id, actor, action, created_at]
      properties:
        event_id:
          type: string
        org_id:
          type: string
        actor:
          type: string
        action:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    SsoProviderEvent:
      type: object
      required: [event_id, org_id, provider_id, provider_type, created_at]
      properties:
        event_id:
          type: string
        org_id:
          type: string
        provider_id:
          type: string
        provider_type:
          type: string
          enum: [oidc, saml]
        created_at:
          type: string
          format: date-time
    RoleAssignmentEvent:
      type: object
      required: [event_id, org_id, principal_id, role_id, created_at]
      properties:
        event_id:
          type: string
        org_id:
          type: string
        principal_id:
          type: string
        role_id:
          type: string
        scope:
          type: string
        created_at:
          type: string
          format: date-time
    RoleEvent:
      type: object
      required: [event_id, org_id, role_id, action, created_at]
      properties:
        event_id:
          type: string
        org_id:
          type: string
        role_id:
          type: string
        action:
          type: string
          enum: [updated, deleted]
        created_at:
          type: string
          format: date-time
    PolicyPackEvent:
      type: object
      required: [event_id, org_id, pack_id, created_at]
      properties:
        event_id:
          type: string
        org_id:
          type: string
        pack_id:
          type: string
        created_at:
          type: string
          format: date-time
    ComplianceReportEvent:
      type: object
      required: [event_id, org_id, report_id, framework, status, created_at]
      properties:
        event_id:
          type: string
        org_id:
          type: string
        report_id:
          type: string
        framework:
          type: string
          enum: [soc2, iso27001]
        status:
          type: string
          enum: [pending, ready, failed]
        integrity_hash:
          type: string
        created_at:
          type: string
          format: date-time
