asyncapi: 2.6.0
info:
  title: AI-BOM Inspector Control Plane Events
  version: 1.0.0
  description: |
    Aspirational event contract for Control Plane integrations. Intended for
    webhook, message bus, or streaming implementations.
servers:
  production:
    url: https://events.example.com
    protocol: https
channels:
  evidence.ingested:
    description: Evidence bundle successfully ingested.
    publish:
      message:
        $ref: '#/components/messages/EvidenceIngested'
  policy.decision.recorded:
    description: Policy decision recorded for an asset.
    publish:
      message:
        $ref: '#/components/messages/PolicyDecisionRecorded'
  audit.event.created:
    description: Audit event created in the Control Plane.
    publish:
      message:
        $ref: '#/components/messages/AuditEventCreated'
components:
  messages:
    EvidenceIngested:
      name: EvidenceIngested
      payload:
        $ref: '#/components/schemas/EvidenceEvent'
    PolicyDecisionRecorded:
      name: PolicyDecisionRecorded
      payload:
        $ref: '#/components/schemas/PolicyDecisionEvent'
    AuditEventCreated:
      name: AuditEventCreated
      payload:
        $ref: '#/components/schemas/AuditEvent'
  schemas:
    EvidenceEvent:
      type: object
      required: [event_id, org_id, asset_fingerprint, bundle_hash, created_at]
      properties:
        event_id:
          type: string
        org_id:
          type: string
        asset_fingerprint:
          type: string
        bundle_hash:
          type: string
        created_at:
          type: string
          format: date-time
    PolicyDecisionEvent:
      type: object
      required: [event_id, org_id, asset_fingerprint, status, created_at]
      properties:
        event_id:
          type: string
        org_id:
          type: string
        asset_fingerprint:
          type: string
        status:
          type: string
          enum: [pass, fail]
        created_at:
          type: string
          format: date-time
    AuditEvent:
      type: object
      required: [event_id, org_id, actor, action, created_at]
      properties:
        event_id:
          type: string
        org_id:
          type: string
        actor:
          type: string
        action:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
